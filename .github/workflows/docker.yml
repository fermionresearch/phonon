name: docker

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the base image is ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Phonon-1 family image: versioned tag only. `:latest` belongs to the current Phonon-2 image (docker-phonon2/,
      # docker-cpu-phonon2/) and is moved by hand.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/fermionresearch/phonon-cuda:0.3.0

      - name: Report digest
        run: docker buildx imagetools inspect ghcr.io/fermionresearch/phonon-cuda:0.3.0
