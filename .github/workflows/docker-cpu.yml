name: docker-cpu

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Phonon-1 family image: versioned tag only. `:latest` belongs to the current Phonon-2 image (docker-phonon2/,
      # docker-cpu-phonon2/) and is moved by hand after its smoke passes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-cpu
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/fermionresearch/phonon-cpu:0.1.0

      - name: Report digest
        run: docker buildx imagetools inspect ghcr.io/fermionresearch/phonon-cpu:0.1.0
